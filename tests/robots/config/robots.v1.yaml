version: "2026-03-04"
phase: "5"
run_policy:
  timezone: "Asia/Shanghai"
  retry_on_failure: 1
  global_timeout_sec: 1800

robots:
  - id: novice_user
    enabled: true
    role: "New user from zero"
    scenario: "scenarios/novice-user.spec.ts"
    priority: "P0"
    sla_sec: 300

  - id: power_creator
    enabled: true
    role: "High-frequency creator"
    scenario: "scenarios/power-creator.spec.ts"
    priority: "P0"
    sla_sec: 240

  - id: regression_daily
    enabled: true
    role: "Deterministic regression"
    scenario: "scenarios/regression-daily.spec.ts"
    priority: "P0"
    sla_sec: 480

  - id: chaos_breaker
    enabled: true
    role: "Boundary and invalid-input stress"
    scenario: "scenarios/chaos-breaker.spec.ts"
    priority: "P0"
    sla_sec: 360

  - id: export_platform_robot
    enabled: true
    role: "Export panel platform switching and policy hint validation"
    scenario: "scenarios/export-platform.spec.ts"
    priority: "P0"
    sla_sec: 300

  - id: v2_compiler_guard
    enabled: true
    role: "V2 compiler marker and scene tier guard"
    scenario: "scenarios/v2-compiler-guard.spec.ts"
    priority: "P0"
    sla_sec: 360

planned_robots:
  - id: quality_scoring
    role: "Rule + VLM scoring"
  - id: judge
    role: "Aggregate and rank failures"
