# Deploy to Cloudflare Pages on push (Direct Upload path).
# Requires GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Optional: disable this workflow and use Cloudflare "Connect to Git" instead (see docs/cloudflare-deploy-options.md).

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Prefer repository secrets; fallback to historical account id as last resort.
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || '0b6b05a3bcbc3ad3ef0ec56d0405d24f' }}
      # Branch-specific tokens (prefer split secrets); fallback to shared token.
      # Allow TEST to fallback to PROD token when users only configured one token.
      CF_API_TOKEN_TEST: ${{ secrets.CLOUDFLARE_API_TOKEN_TEST || secrets.CLOUDFLARE_API_TOKEN_PROD || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CF_API_TOKEN_PROD: ${{ secrets.CLOUDFLARE_API_TOKEN_PROD || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - name: Validate deploy credentials (develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          if [ -z "${CF_API_TOKEN_TEST}" ]; then
            echo "Missing test deploy token. Set CLOUDFLARE_API_TOKEN_TEST (or shared CLOUDFLARE_API_TOKEN / CF_API_TOKEN)." >&2
            exit 1
          fi

      - name: Validate deploy credentials (main)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${CF_API_TOKEN_PROD}" ]; then
            echo "Missing prod deploy token. Set CLOUDFLARE_API_TOKEN_PROD (or shared CLOUDFLARE_API_TOKEN / CF_API_TOKEN)." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (develop → scenepilotix)
        if: github.ref == 'refs/heads/develop'
        run: npx -y wrangler pages deploy dist --project-name=scenepilotix
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN_TEST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages (main → scenepilotix1-prod)
        if: github.ref == 'refs/heads/main'
        run: npx -y wrangler pages deploy dist --project-name=scenepilotix1-prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
