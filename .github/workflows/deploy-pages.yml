name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── develop → scenepilotix (test) ─────────────────────────────────────
      - name: Build develop bundle
        if: github.ref == 'refs/heads/develop'
        run: npm run build -- --outDir dist-test
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: https://sampclwsqputkeswqbbu.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_BASE_URL: https://scenepilotix.pages.dev
          VITE_BILLING_ENABLED: "1"
          VITE_BILLING_LIVE_BLOCKED: "1"
          VITE_AUTH_MOCK_FALLBACK: "0"

      - name: Deploy develop → scenepilotix
        if: github.ref == 'refs/heads/develop'
        run: npx -y wrangler pages deploy dist-test --project-name=scenepilotix --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      # ── main → scenepilotix1-prod (production) ────────────────────────────
      - name: Build main bundle
        if: github.ref == 'refs/heads/main'
        run: npm run build -- --outDir dist-prod
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: https://sampclwsqputkeswqbbu.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_BASE_URL: https://www.scenepilotix.com
          VITE_BILLING_ENABLED: "1"
          VITE_BILLING_LIVE_BLOCKED: "0"
          VITE_AUTH_MOCK_FALLBACK: "0"

      - name: Deploy main → scenepilotix1-prod
        if: github.ref == 'refs/heads/main'
        run: npx -y wrangler pages deploy dist-prod --project-name=scenepilotix1-prod --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
