name: Robots Daily

on:
  push:
    branches:
      - develop
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  robots-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run robot suite (live)
        env:
          ROBOT_E2E_LIVE: "1"
        run: npm run engine:lock:check && node tests/robots/scripts/run-robots-daily.mjs

      - name: Upload robot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robots-artifacts-${{ github.run_id }}
          path: tests/robots/artifacts
          retention-days: 14
